[project]
name = "ttso"
version = "0.1.0"
description = "Time-Travel Structured Outputs: stateful repair of LLM structured outputs with a compiled zero-parameter Gated DeltaNet verifier (DiffRepair)"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "transformers>=4.51", "numpy>=1.26"]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ttso*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s"
